[project]
name = "rag-docs"
version = "0.1.0"
description = "Gate 1 do Noclaf School: RAG sobre a documentação do time"
requires-python = ">=3.12"
dependencies = [
  "neo4j>=5.20",
  "openai>=1.40",
  "python-dotenv>=1.0",
]

[project.scripts]
rag-docs = "rag_docs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: precisa do Neo4j rodando (docker compose up -d)"]
addopts = "-m 'not integration'"
